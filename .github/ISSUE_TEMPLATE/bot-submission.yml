name: Bot submission
description: Enter your bot into the Terrabots tournament and leaderboard
title: "Bot submission: "
labels: ["bot submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for entering! **Don't paste code here: issues are public.**
        Private (default): put your bot in a private GitHub repository and give @devbyandre read access.
        Public: open a pull request adding `contrib/<your-github-name>/<bot>.py` instead.
        Details and rules: CONTRIBUTING.md#submit-a-bot.
  - type: input
    id: name
    attributes:
      label: Bot class name(s)
      placeholder: "MyTank"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: ["Battle", "Survival", "Both"]
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Private repository (owner/name), or the number of your pull request
      placeholder: "yourname/my-terrabots-bot"
    validations:
      required: true
  - type: dropdown
    id: publish
    attributes:
      label: May we publish the code?
      description: Without a yes here, only the bot's name, your GitHub name and its scores are published.
      options:
        - "No: keep my code private (closed source on the leaderboard)"
        - "Yes: publish it in contrib/ under the MIT license"
    validations:
      required: true
  - type: textarea
    id: strategy
    attributes:
      label: Strategy (optional)
      description: Shown publicly only if you chose to publish your code.
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: The bot is my own work
          required: true
        - label: It plays in the sandbox (no network, files only via self.storage), see CONTRIBUTING.md
          required: true
