name: Check bots

# A quick tournament for pull requests that add or change bots: every bot in
# contrib/ plays sandboxed, so a broken (or hostile) bot shows up here, not on
# anyone's machine. Nothing is written back: the leaderboard itself is built by
# the maintainer (tools/tournament.py), where private submissions live too.
on:
  pull_request:
    paths: ["contrib/**", "terrabots/agents/**", "bots/**", "tools/tournament.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: docker build -t terrabots-sandbox -f docker/sandbox.Dockerfile docker/
      - run: python tools/tournament.py --quick --workers 4 --out /tmp/leaderboard
