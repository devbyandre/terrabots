[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrabots"
version = "0.2.0"
description = "Robocode-style tank battles and agent simulation on 2.5D terrain, for learning Python, AI, statistics and ML"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "André Munzinger", email = "munzinger.andre@web.de" }]
requires-python = ">=3.11"
keywords = ["simulation", "agents", "ai", "machine-learning", "education", "robocode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "numpy>=1.26",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ml = [
    "torch>=2.2",
]

[project.urls]
Homepage = "https://devbyandre.github.io/terrabots/"
Repository = "https://github.com/devbyandre/terrabots"

[project.scripts]
terrabots-run = "terrabots.run:main"
terrabots-battle = "terrabots.battle.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terrabots*"]

[tool.setuptools.package-data]
"terrabots.viewer" = ["index.html", "battle.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
